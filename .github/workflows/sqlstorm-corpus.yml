name: SQLStorm corpus checks

on:
  pull_request:
    paths:
      - "sqlstorm/**"
      - ".github/workflows/sqlstorm-corpus.yml"
      - ".github/workflows/license-header-check.yml"
  push:
    branches: [dev]
    paths:
      - "sqlstorm/**"
      - ".github/workflows/sqlstorm-corpus.yml"

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check catalog validation and reconstruction
        run: python -m unittest discover -s sqlstorm/tests -p 'test*.py' -v
      - name: Verify all query hashes, suite membership, and MIT license
        run: python -m sqlstorm.catalog validate
